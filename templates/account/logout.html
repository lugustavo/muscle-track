{% extends 'base.html' %}
{% load crispy_forms_tags %}

{% block title %}Sair - Muscle Track{% endblock %}

{% block content %}
<div class="row justify-content-center mt-5">
    <div class="col-md-6 col-lg-4">
        <div class="card shadow-lg border-0">
            <div class="card-body p-5 text-center">
                <div class="mb-4">
                    <i class="bi bi-box-arrow-right text-warning" style="font-size: 4rem;"></i>
                </div>
                <h2 class="mb-4">Sair</h2>
                <p class="text-muted mb-4">Tem certeza de que deseja sair?</p>

                <form method="post" action="{% url 'account_logout' %}">
                    {% csrf_token %}
                    {% if redirect_field_value %}
                    <input type="hidden" name="{{ redirect_field_name }}" value="{{ redirect_field_value }}"/>
                    {% endif %}

                    <button type="submit" class="btn btn-warning btn-lg w-100 mb-3">
                        <i class="bi bi-box-arrow-right"></i> Sair
                    </button>
                    <a href="{% url 'core:home' %}" class="btn btn-outline-secondary w-100">
                        <i class="bi bi-arrow-left"></i> Cancelar
                    </a>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
