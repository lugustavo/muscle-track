{% load i18n %}
<div class="offcanvas offcanvas-top" tabindex="-1" id="searchSheet" aria-labelledby="searchSheetLabel" data-suggest-url="{% url 'core:search_suggest' %}" data-search-url="{% url 'core:search' %}" style="height: auto; max-height: 85vh;">
    <div class="offcanvas-header pb-2">
        <h2 class="offcanvas-title h5" id="searchSheetLabel">{% trans "Buscar" %}</h2>
        <button type="button" class="btn-close" data-bs-dismiss="offcanvas" aria-label="{% trans "Fechar" %}"></button>
    </div>
    <div class="offcanvas-body pt-0">
        <form role="search" action="{% url 'core:search' %}" method="get" data-search-form>
            <input type="search" name="q" class="form-control form-control-lg" placeholder="{% trans "Aluno, exercício ou treino..." %}" aria-label="{% trans "Buscar" %}" maxlength="80" autocomplete="off" data-search-input>
        </form>
        <div class="visually-hidden" aria-live="polite" data-search-status></div>
        <div class="mt-3" data-search-results></div>
        <div class="mt-3 d-none" data-search-recent>
            <div class="d-flex justify-content-between align-items-center mb-1">
                <small class="text-muted text-uppercase">{% trans "Recentes" %}</small>
                <button type="button" class="btn btn-link btn-sm p-0" data-search-clear>{% trans "limpar" %}</button>
            </div>
            <div class="list-group list-group-flush" data-search-recent-list></div>
        </div>
        <p class="small text-muted mt-3 mb-0 d-none d-lg-block">{% blocktrans trimmed %}<kbd>↑</kbd> <kbd>↓</kbd> escolher · <kbd>Enter</kbd> abrir · <kbd>Esc</kbd> fechar{% endblocktrans %}</p>
    </div>
</div>
