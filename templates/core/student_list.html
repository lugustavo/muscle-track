{% extends 'base.html' %}

{% block content %}
<div class="d-flex justify-content-between align-items-center mb-4">
    <h1><i class="bi bi-people"></i> Alunos</h1>
    <a href="{% url 'core:student_create' %}" class="btn btn-primary">
        <i class="bi bi-plus-circle"></i> Novo Aluno
    </a>
</div>

<div class="row g-3">
    {% for student in students %}
    <div class="col-md-6 col-lg-4">
        <div class="card">
            <div class="card-body">
                <h5 class="card-title">{{ student.person_name }}</h5>
                <p class="card-text text-muted">{{ student.phone }}</p>
                <a href="{% url 'core:student_detail' student.pk %}" class="btn btn-sm btn-outline-primary">Ver Detalhes</a>
            </div>
        </div>
    </div>
    {% empty %}
    <div class="col-12">
        <div class="alert alert-info">Nenhum aluno cadastrado.</div>
    </div>
    {% endfor %}
</div>
{% endblock %}
