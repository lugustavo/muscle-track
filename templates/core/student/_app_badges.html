{% load i18n %}{# Badges for how the student is followed: without the app, and the modality. Needs `student`. #}
{% if not student.has_app %}<span class="ui-badge" data-no-app title="{% trans "Só tem ficha com você: sem login no app" %}"><i class="bi bi-phone-flip"></i> {% trans "Sem app" %}</span>{% endif %}
{% if student.modality %}<span class="ui-badge" data-modality="{{ student.modality }}">{{ student.get_modality_display }}</span>{% endif %}
