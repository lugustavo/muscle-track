{% load i18n %}
{% if trail %}
<nav aria-label="{% trans "breadcrumb" %}" class="breadcrumb-nav d-none d-lg-block">
    <ol class="breadcrumb">
        {% for label, url in trail %}
        {% if url %}
        <li class="breadcrumb-item"><a href="{{ url }}">{{ label }}</a></li>
        {% else %}
        <li class="breadcrumb-item active" aria-current="page">{{ label }}</li>
        {% endif %}
        {% endfor %}
    </ol>
</nav>
{% endif %}
