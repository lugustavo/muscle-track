<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#667eea;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#764ba2;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="weightGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#cbd5e0;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#ffffff;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#a0aec0;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- Background circle -->
  <circle cx="256" cy="256" r="248" fill="url(#bgGrad)"/>

  <!-- Shadow -->
  <ellipse cx="256" cy="420" rx="180" ry="30" fill="#000" opacity="0.15"/>

  <!-- Left weight plate -->
  <g>
    <ellipse cx="130" cy="256" rx="70" ry="100" fill="url(#weightGrad)" stroke="#718096" stroke-width="4"/>
    <ellipse cx="130" cy="256" rx="55" ry="85" fill="none" stroke="#a0aec0" stroke-width="2"/>
    <ellipse cx="130" cy="256" rx="40" ry="65" fill="#667eea" opacity="0.2"/>
    <ellipse cx="130" cy="220" rx="25" ry="35" fill="white" opacity="0.4"/>
  </g>

  <!-- Left connector -->
  <rect x="185" y="231" width="50" height="50" fill="#cbd5e0" stroke="#718096" stroke-width="3" rx="5"/>
  <rect x="190" y="236" width="40" height="40" fill="#e2e8f0" opacity="0.5"/>

  <!-- Center bar (grip) -->
  <rect x="220" y="241" width="72" height="30" fill="#a0aec0" stroke="#718096" stroke-width="3" rx="4"/>

  <!-- Grip texture lines -->
  <line x1="235" y1="241" x2="235" y2="271" stroke="#718096" stroke-width="3" opacity="0.5"/>
  <line x1="245" y1="241" x2="245" y2="271" stroke="#718096" stroke-width="3" opacity="0.5"/>
  <line x1="256" y1="241" x2="256" y2="271" stroke="#718096" stroke-width="3" opacity="0.5"/>
  <line x1="267" y1="241" x2="267" y2="271" stroke="#718096" stroke-width="3" opacity="0.5"/>
  <line x1="277" y1="241" x2="277" y2="271" stroke="#718096" stroke-width="3" opacity="0.5"/>

  <!-- Right connector -->
  <rect x="277" y="231" width="50" height="50" fill="#cbd5e0" stroke="#718096" stroke-width="3" rx="5"/>
  <rect x="282" y="236" width="40" height="40" fill="#e2e8f0" opacity="0.5"/>

  <!-- Right weight plate -->
  <g>
    <ellipse cx="382" cy="256" rx="70" ry="100" fill="url(#weightGrad)" stroke="#718096" stroke-width="4"/>
    <ellipse cx="382" cy="256" rx="55" ry="85" fill="none" stroke="#a0aec0" stroke-width="2"/>
    <ellipse cx="382" cy="256" rx="40" ry="65" fill="#667eea" opacity="0.2"/>
    <ellipse cx="382" cy="220" rx="25" ry="35" fill="white" opacity="0.4"/>
  </g>

  <!-- Additional depth shadows -->
  <ellipse cx="130" cy="300" rx="30" ry="20" fill="#000" opacity="0.2"/>
  <ellipse cx="382" cy="300" rx="30" ry="20" fill="#000" opacity="0.2"/>
</svg>
