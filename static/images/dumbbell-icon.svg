<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="metalGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#4a5568;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#718096;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#2d3748;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="barGradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#a0aec0;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#cbd5e0;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#718096;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- Left weight -->
  <g>
    <!-- Outer plate -->
    <ellipse cx="100" cy="256" rx="60" ry="80" fill="url(#metalGradient)" stroke="#2d3748" stroke-width="3"/>
    <ellipse cx="100" cy="256" rx="50" ry="70" fill="none" stroke="#4a5568" stroke-width="2" opacity="0.5"/>

    <!-- Inner detail -->
    <ellipse cx="100" cy="256" rx="35" ry="55" fill="#2d3748" opacity="0.3"/>
  </g>

  <!-- Left connector -->
  <rect x="140" y="236" width="60" height="40" fill="url(#barGradient)" stroke="#2d3748" stroke-width="2" rx="5"/>

  <!-- Center bar -->
  <rect x="180" y="246" width="152" height="20" fill="url(#barGradient)" stroke="#2d3748" stroke-width="2" rx="3"/>

  <!-- Center grip texture -->
  <line x1="220" y1="246" x2="220" y2="266" stroke="#4a5568" stroke-width="2"/>
  <line x1="235" y1="246" x2="235" y2="266" stroke="#4a5568" stroke-width="2"/>
  <line x1="250" y1="246" x2="250" y2="266" stroke="#4a5568" stroke-width="2"/>
  <line x1="265" y1="246" x2="265" y2="266" stroke="#4a5568" stroke-width="2"/>
  <line x1="280" y1="246" x2="280" y2="266" stroke="#4a5568" stroke-width="2"/>
  <line x1="295" y1="246" x2="295" y2="266" stroke="#4a5568" stroke-width="2"/>

  <!-- Right connector -->
  <rect x="312" y="236" width="60" height="40" fill="url(#barGradient)" stroke="#2d3748" stroke-width="2" rx="5"/>

  <!-- Right weight -->
  <g>
    <!-- Outer plate -->
    <ellipse cx="412" cy="256" rx="60" ry="80" fill="url(#metalGradient)" stroke="#2d3748" stroke-width="3"/>
    <ellipse cx="412" cy="256" rx="50" ry="70" fill="none" stroke="#4a5568" stroke-width="2" opacity="0.5"/>

    <!-- Inner detail -->
    <ellipse cx="412" cy="256" rx="35" ry="55" fill="#2d3748" opacity="0.3"/>
  </g>

  <!-- Highlights for 3D effect -->
  <ellipse cx="100" cy="236" rx="20" ry="25" fill="white" opacity="0.2"/>
  <ellipse cx="412" cy="236" rx="20" ry="25" fill="white" opacity="0.2"/>

  <!-- Shadows for depth -->
  <ellipse cx="100" cy="276" rx="25" ry="15" fill="black" opacity="0.3"/>
  <ellipse cx="412" cy="276" rx="25" ry="15" fill="black" opacity="0.3"/>
</svg>
