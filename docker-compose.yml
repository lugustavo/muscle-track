# Muscle Track - self-hosted stack: PostgreSQL + Django (gunicorn) + Caddy (automatic HTTPS)
#
#   cp .env.example .env     # fill in DOMAIN, SECRET_KEY, POSTGRES_PASSWORD
#   docker compose up -d --build
name: muscle-track

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-muscle_track}
      POSTGRES_USER: ${POSTGRES_USER:-muscle_track}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Defina POSTGRES_PASSWORD no arquivo .env}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10

  web:
    build: .
    image: muscle-track-app
    restart: unless-stopped
    env_file: .env
    # DNS públicos para o app sair para a internet (e-mail, aviso no aparelho, IA) mesmo que o DNS da rede
    # bloqueie domínios do Google. Os nomes internos (db) continuam resolvidos pelo Docker. Para usar o DNS
    # da própria rede, defina WEB_DNS_1 e WEB_DNS_2 no .env com os endereços dele.
    dns:
      - ${WEB_DNS_1:-1.1.1.1}
      - ${WEB_DNS_2:-8.8.8.8}
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-muscle_track}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-muscle_track}
      BACKUP_STATUS_FILE: /backups/status.json
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - media:/app/media
      # the result of the last backup (read only): the app warns the trainer when backups are old or failing
      - ${BACKUP_DIR:-./backups}:/backups:ro
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/healthz', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 40s

  # Lembretes automáticos (aula, plano vencendo): roda `send_reminders` a cada 10 minutos. Mesma imagem do web;
  # espera o web ficar saudável (as migrações rodam lá) e não passa pelo entrypoint.
  scheduler:
    image: muscle-track-app
    restart: unless-stopped
    env_file: .env
    dns:
      - ${WEB_DNS_1:-1.1.1.1}
      - ${WEB_DNS_2:-8.8.8.8}
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-muscle_track}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-muscle_track}
    depends_on:
      web:
        condition: service_healthy
    entrypoint: []
    command: ["sh", "-c", "while true; do python manage.py send_reminders || true; sleep 600; done"]

  # Automatic backups: the database (pg_dump) and the media folder, once a day, kept in ./backups (BACKUP_DIR) with
  # retention, and optionally copied off the server (BACKUP_RCLONE_REMOTE). Restore: see "Backup" in the README.
  backup:
    build: ./backup
    image: muscle-track-backup
    restart: unless-stopped
    env_file: .env
    environment:
      PGHOST: db
      PGUSER: ${POSTGRES_USER:-muscle_track}
      PGPASSWORD: ${POSTGRES_PASSWORD}
      PGDATABASE: ${POSTGRES_DB:-muscle_track}
      TZ: ${TZ:-America/Sao_Paulo}
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ${BACKUP_DIR:-./backups}:/backups
      - media:/media

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    environment:
      DOMAIN: ${DOMAIN:?Defina DOMAIN no arquivo .env}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      web:
        condition: service_healthy

volumes:
  pgdata:
  media:
  caddy_data:
  caddy_config:
