name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r requirements.txt -r requirements-dev.txt ruff
      - run: ruff check . --select F,E9
      - run: python manage.py makemigrations --check --dry-run
        env:
          SECRET_KEY: ci-only-key
      - run: python manage.py test
      - run: node --check static/js/workout.js

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate compose file with the example env
        run: cp .env.example .env && docker compose config --quiet
      - name: Build image
        run: docker build -t muscle-track:ci .
